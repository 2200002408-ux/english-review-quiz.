 let n=$('mode').value;if(n!=='all')src=src.slice(0,Number(n));
 questions=src.map(x=>({...x,opts:$('shuffleA').checked?shuffle(x.opts):x.opts}));
 index=0;correct=0;$('setup').classList.add('hidden');$('result').style.display='none';$('game').classList.remove('hidden');render();
}
function render(){
 answered=false;let item=questions[index];
 $('counter').textContent=`Câu ${index+1}/${questions.length}`;
 $('score').textContent=`Đúng: ${correct}`;
 $('sectionName').textContent=BANK[currentSection].name;
 $('bar').style.width=`${index/questions.length*100}%`;
 $('number').textContent=`QUESTION ${index+1}`;
 $('question').textContent=item.q;
 $('answers').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='';
 item.opts.forEach((opt,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+opt.t;b.onclick=()=>choose(i);$('answers').appendChild(b)});
 $('next').disabled=true;$('next').textContent=index===questions.length-1?'Xem kết quả':'Câu tiếp theo →';
}
function choose(i){
 if(answered)return;answered=true;let item=questions[index],buttons=[...$('answers').children],chosen=item.opts[i],right=item.opts.findIndex(o=>o.ok);
 buttons.forEach((b,j)=>{b.disabled=true;if(item.opts[j].ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});
 let f=$('feedback');f.className='feedback show '+(chosen.ok?'ok':'no');
 f.textContent=chosen.ok?'✓ Chính xác!':`✗ Chưa đúng. Đáp án đúng: ${String.fromCharCode(65+right)}. ${item.opts[right].t}`;
 if(chosen.ok)correct++;$('score').textContent=`Đúng: ${correct}`;$('next').disabled=false;
}
function next(){if(!answered)return;if(index<questions.length-1){index++;render()}else finish()}
function finish(){
 $('game').classList.add('hidden');$('result').style.display='block';
 let pct=Math.round(correct/questions.length*100);$('finalScore').textContent=`${correct}/${questions.length}`;
 $('summary').textContent=`Bạn trả lời đúng ${pct}% số câu. ${pct>=80?'Rất tốt! Hãy tiếp tục phát huy.':pct>=50?'Khá tốt! Ôn lại những câu sai nhé.':'Đừng nản, hãy thử lại để ghi nhớ tốt hơn nhé!'}`;
 $('bar').style.width='100%';
}
function back(){ $('game').classList.add('hidden');$('result').style.display='none';$('setup').classList.remove('hidden')}
$('start').onclick=start;$('next').onclick=next;$('quit').onclick=back;$('retry').onclick=start;$('back').onclick=back;
</script></body></html>
